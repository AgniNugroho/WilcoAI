[package]
name = "wilcoai-client"
version = "0.1.0"
description = "Wilco AI X-Plane 12 Virtual ATC Desktop Companion"
authors = ["Wilco AI Team"]
edition = "2021"

[lib]
name = "wilcoai_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
ringbuf = "0.3"
biquad = "0.4"
gilrs = "0.10"
global-hotkey = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
